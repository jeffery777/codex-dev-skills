project:
  schema_version: 2
  name: "v0.12.0 V3-A release closure"
  objective_id: "issue-137"
  source_of_truth:
    - "AGENTS.md"
    - "docs/loops/issue-137/release-spec.md"
    - "docs/loops/issue-137/implementation-plan.md"
    - "docs/release-notes-v0.12.0.md"
    - "docs/release-readiness.md"
  contract_revision:
    previous_manifest_sha256: ""
    updated_at: "2026-08-11T03:40:30Z"

tasks:
  - id: "R0-baseline"
    title: "Verify release baseline and ownership"
    initial_status: "ready"
    priority: "high"
    dependencies: []
    risk: "medium"
    kind: "review"
    objective: "Prove accepted main, release, tag, and collision state before mutation."
    scope:
      in: ["Git state", "GitHub Issue/PR state", "tag state", "Release state"]
      out: ["tag creation", "Release publication"]
    ownership:
      expected_paths: []
      parallel_write_safe: false
    dod:
      - "Accepted main and Issue #137 ownership are current."
      - "The latest Release and v0.12.0 tag state are recorded."
    verification: ["git status --short --branch", "git ls-remote --tags origin refs/tags/v0.12.0"]
    review: {required: true, mode: "release-plan"}
    stop_conditions: ["A release collision or existing v0.12.0 tag appears."]
    human_gate: {required: false, gate: "", reason: ""}

  - id: "R1-release-alignment"
    title: "Align v0.12.0 release records"
    initial_status: "planned"
    priority: "high"
    dependencies: ["R0-baseline"]
    risk: "medium"
    kind: "docs"
    objective: "Make the repository release record internally consistent."
    scope:
      in: ["release notes", "README", "roadmap/program status", "release metadata test"]
      out: ["runtime behavior", "V3-B", "Agent Memory", "V3-C"]
    ownership:
      expected_paths: ["README.md", "docs", "tests/test_improvement_proposal_contract_docs.py"]
      parallel_write_safe: false
    dod:
      - "Release surfaces identify v0.12.0 without overstating later phases."
      - "Catalog and installer remain aligned at 0.12.0."
    verification: ["python3 -m unittest tests.test_improvement_proposal_contract_docs", "git diff --check"]
    review: {required: true, mode: "docs-review-gate"}
    stop_conditions: ["Runtime or public-contract behavior would change."]
    human_gate: {required: false, gate: "", reason: ""}

  - id: "R2-verification-review"
    title: "Verify and review the release candidate"
    initial_status: "planned"
    priority: "high"
    dependencies: ["R1-release-alignment"]
    risk: "high"
    kind: "review"
    objective: "Produce exact, rerunnable release-readiness evidence."
    scope:
      in: ["tests", "evals", "repository validation", "privacy", "formal reviews"]
      out: ["merge", "tag", "Release"]
    ownership:
      expected_paths: ["docs/loops/issue-137/receipts"]
      parallel_write_safe: false
    dod:
      - "All required checks and gates pass without unresolved blockers."
      - "Receipts contain no private or machine-local material."
    verification: ["python3 -m unittest discover -s tests -p 'test_*.py'", "./scripts/validate-repo.sh", "git diff --check"]
    review: {required: true, mode: "merge-review-deep"}
    stop_conditions: ["Verification or review fails without an in-scope fix."]
    human_gate: {required: false, gate: "", reason: ""}

  - id: "R3-draft-pr"
    title: "Prepare exact-head draft PR"
    initial_status: "planned"
    priority: "high"
    dependencies: ["R2-verification-review"]
    risk: "medium"
    kind: "publication"
    objective: "Reach auditable draft-PR readiness without merging or publishing."
    scope:
      in: ["commit", "push", "draft PR", "hosted CI", "PR traceability"]
      out: ["ready transition", "merge", "tag", "Release"]
    ownership:
      expected_paths: ["docs/loops/issue-137/receipts"]
      parallel_write_safe: false
    dod:
      - "Draft PR closes Issue #137 when later made ready and merged."
      - "Exact-head hosted CI and review evidence pass."
    verification: ["GitHub PR metadata", "GitHub Actions exact-head result"]
    review: {required: true, mode: "merge-readiness-gate"}
    stop_conditions: ["The PR head moves or a required check fails."]
    human_gate: {required: false, gate: "", reason: "Bounded draft-PR preparation is delegated by the user."}

  - id: "R4-publish"
    title: "Merge and publish v0.12.0"
    initial_status: "planned"
    priority: "high"
    dependencies: ["R3-draft-pr"]
    risk: "high"
    kind: "release"
    objective: "Bind the exact reviewed release merge to tag v0.12.0 and the GitHub Release."
    scope:
      in: ["ready transition", "merge", "annotated tag", "GitHub Release", "public verification"]
      out: ["deploy", "activation", "global installation", "later phases"]
    ownership:
      expected_paths: []
      parallel_write_safe: false
    dod:
      - "Tag and Release bind the exact approved release merge commit."
      - "Public latest-Release evidence is v0.12.0."
    verification: ["Git/GitHub exact SHA and Release metadata"]
    review: {required: true, mode: "human-release-gate"}
    stop_conditions: ["Exact publication authorization is absent or evidence drifts."]
    human_gate:
      required: true
      gate: "merge-tag-release"
      reason: "Ready transition, merge, annotated tag, and GitHub Release require exact final human authorization."

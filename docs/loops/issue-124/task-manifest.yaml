project:
  schema_version: 2
  name: "Loop Engineering V2d-B Improvement Lineage And Projections"
  objective_id: "issue-124"
  source_of_truth:
    - "AGENTS.md"
    - "https://github.com/jeffery777/codex-dev-skills/issues/124"
    - "docs/loops/issue-124/loop-spec.md"
    - "docs/loops/issue-124/implementation-plan.md"
  contract_revision:
    previous_manifest_sha256: ""
    updated_at: "2026-07-30T03:49:42Z"

tasks:
  - id: "P0-contract"
    title: "Freeze V2d-B public contracts and implementation plan"
    initial_status: "ready"
    priority: "high"
    dependencies: []
    risk: "high"
    kind: "docs"
    objective: "Resolve contract families, composition, identity, lineage, roles, privacy, projections, migration, packaging, release scope, and verification."
    scope:
      in: ["Issue #124 spec", "implementation plan", "task manifest", "initial ledger"]
      out: ["production code", "external write"]
    ownership:
      expected_paths: ["docs/loops/issue-124"]
      parallel_write_safe: false
    dod:
      - "Public-contract, compatibility, privacy, authority, role, projection, migration, and release semantics are explicit."
      - "Docs review and formal docs gate have no unresolved MUST-FIX findings."
    verification:
      - "python3 scripts/validate-loop-ledger.py"
      - "git diff --check"
    review: {required: true, mode: "docs-review"}
    stop_conditions:
      - "Any public-contract, privacy, authority, role-separation, projection, or migration semantic remains ambiguous."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P1-lineage"
    title: "Implement strict improvement lineage contract and CLI"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P0-contract"]
    risk: "high"
    kind: "implementation"
    objective: "Implement strict parsing, digests, V2d-A composition, snapshot identity, role separation, and deterministic lineage validation."
    scope:
      in: ["improvement_lineage.py", "improvementctl.py", "focused tests"]
      out: ["V2d-A contract changes", "network", "runtime services", "promotion"]
    ownership:
      expected_paths: ["skills/loop-engineering/scripts", "tests"]
      parallel_write_safe: false
    dod:
      - "Improvement records and composed V2d-A references fail closed."
      - "Duplicate/conflict, missing reference, cycle, stale baseline, environment mismatch, and role collision are rejected."
      - "The four authority invariants cannot be raised."
    verification:
      - "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.test_improvement_lineage tests.test_improvementctl tests.test_operational_evidence"
    review: {required: true, mode: "code-review-deep"}
    stop_conditions:
      - "Implementation requires weakening or reinterpreting loop-operational-evidence/v0."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P2-projections"
    title: "Implement deterministic human and graph projections"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P1-lineage"]
    risk: "high"
    kind: "implementation"
    objective: "Implement tool-neutral Markdown and typed graph manifests plus the optional declarative Obsidian profile."
    scope:
      in: ["projection builders/validators", "Obsidian reference profile", "focused tests"]
      out: ["vault write/sync", "graph database/runtime", "free-form templates"]
    ownership:
      expected_paths: ["skills/loop-engineering", "tests"]
      parallel_write_safe: false
    dod:
      - "Repeated projections are byte-identical and source-bound."
      - "Projection injection, source mismatch, graph mismatch, and false authority are rejected."
      - "Obsidian remains optional and has no runtime dependency."
    verification:
      - "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.test_improvement_lineage tests.test_improvementctl"
    review: {required: true, mode: "code-review-deep"}
    stop_conditions:
      - "A deterministic projection requires uncontrolled prose, private data, or target mutation."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P3-fixtures-eval"
    title: "Add fixtures, evals, and regression validation"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P2-projections"]
    risk: "high"
    kind: "implementation"
    objective: "Prove every positive/adversarial contract case, deterministic regeneration, privacy, tamper resistance, and zero false authority."
    scope:
      in: ["synthetic fixtures", "unit/CLI tests", "eval suite", "repository validation"]
      out: ["real improvement records", "private PoC"]
    ownership:
      expected_paths: ["evals/improvement-lineage", "tests", "scripts"]
      parallel_write_safe: false
    dod:
      - "Required fixture inventory is complete and exact eval thresholds pass."
      - "All existing operational-evidence and earlier workflow regressions pass."
    verification:
      - "python3 scripts/eval-improvement-lineage.py"
      - "python3 scripts/eval-operational-evidence.py"
      - "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'"
    review: {required: true, mode: "code-review-deep"}
    stop_conditions:
      - "A required adversarial case cannot be represented safely with synthetic data."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P4-docs-release"
    title: "Align public docs, packaging, and v0.11.0 preparation"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P3-fixtures-eval"]
    risk: "medium"
    kind: "docs"
    objective: "Document V2d-B contracts and prepare v0.11.0 on the same branch without external publication."
    scope:
      in: ["contract docs", "portable references", "README", "roadmap", "program docs", "installer/catalog", "release notes"]
      out: ["separate release branch", "tag", "GitHub Release"]
    ownership:
      expected_paths: ["README.md", "docs", "skills/loop-engineering", "install.sh", "catalog.yaml"]
      parallel_write_safe: false
    dod:
      - "Public usage, boundaries, composition, projections, packaging, and release metadata agree."
      - "README, installer, catalog, release readiness, and notes identify v0.11.0."
    verification:
      - "./scripts/validate-repo.sh"
      - "git diff --check"
    review: {required: true, mode: "docs-review"}
    stop_conditions:
      - "Release scope requires unrelated work or a second feature branch."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P5-readiness"
    title: "Close reviews and prepare working-tree readiness"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P4-docs-release"]
    risk: "high"
    kind: "review"
    objective: "Run complete tracked/untracked verification, deep code/docs/security reviews, formal gates, and record residual risk before the commit gate."
    scope:
      in: ["verification", "review closure", "readiness receipts"]
      out: ["commit", "push", "PR creation", "merge", "tag", "release publication"]
    ownership:
      expected_paths: ["docs/loops/issue-124"]
      parallel_write_safe: false
    dod:
      - "No unresolved MUST-FIX finding remains."
      - "The complete tracked/untracked working tree is covered with readiness evidence."
      - "Exact-head merge review is deferred until a separately authorized commit exists."
    verification:
      - "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'"
      - "./scripts/validate-repo.sh"
      - "gitnexus detect-changes"
      - "git diff --check"
      - "git status --short --branch"
      - "git ls-files --others --exclude-standard"
    review: {required: true, mode: "formal-gate"}
    stop_conditions:
      - "Publication or release action requires exact authorization."
    human_gate:
      required: true
      gate: "publication"
      reason: "Commit, push, PR creation/review submission, platform comment, merge, tag, and GitHub Release require exact authorization."

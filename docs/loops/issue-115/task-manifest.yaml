project:
  schema_version: 2
  name: "Codex CLI-native session handoff adapter"
  objective_id: "issue-115"
  source_of_truth:
    - "AGENTS.md"
    - "docs/loops/issue-115/loop-spec.md"
    - "docs/loops/issue-115/implementation-plan.md"
    - "docs/native-runtime-capabilities.md"
    - "policies/runtime-compatibility-policy.md"
  contract_revision:
    previous_manifest_sha256: ""
    updated_at: "2026-07-24T02:57:31Z"

tasks:
  - id: "P0-contract-boundary"
    title: "Define the CLI session adapter contract and risk boundary"
    initial_status: "ready"
    priority: "high"
    dependencies: []
    risk: "medium"
    kind: "docs"
    objective: "Keep CLI, shared-core, and Desktop entry paths independent."
    scope:
      in: ["runtime contract", "request/result schema", "failure taxonomy", "human gates"]
      out: ["live session creation", "app-server client", "Desktop callable changes"]
    ownership:
      expected_paths: ["docs/loops/issue-115"]
      parallel_write_safe: false
    dod:
      - "The adapter binds only to documented stable CLI surfaces."
      - "Shared task selection and completion authority remain unchanged."
    verification:
      - "git diff --check"
    review: {required: true, mode: "docs-review"}
    stop_conditions: ["The design requires an experimental or private runtime interface."]
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P1-cli-adapter"
    title: "Implement the offline CLI handoff adapter"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P0-contract-boundary"]
    risk: "high"
    kind: "implementation"
    objective: "Launch one bounded start/resume operation and emit a redacted receipt."
    scope:
      in: ["new CLI skill", "executor", "fixed argv", "JSONL parser", "failure handling"]
      out: ["Desktop tools", "app-server", "daemon", "retry loop", "publication"]
    ownership:
      expected_paths: ["skills/cli-session-handoff"]
      parallel_write_safe: false
    dod:
      - "Start and resume have fail-closed versioned contracts."
      - "No shell, private-state read, or permission widening is possible."
    verification:
      - "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.test_cli_session_handoff"
    review: {required: true, mode: "code-review-deep"}
    stop_conditions:
      - "The executor cannot bound output or terminate timed-out child processes."
      - "The only remaining implementation requires credentials or private runtime state."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P2-tests-distribution-docs"
    title: "Integrate tests, installer metadata, and runtime documentation"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P1-cli-adapter"]
    risk: "medium"
    kind: "implementation"
    objective: "Make the adapter installable, discoverable, and regression-tested."
    scope:
      in: ["tests", "catalog", "installer", "README", "runtime docs", "routing docs"]
      out: ["version release", "live smoke", "plugin packaging"]
    ownership:
      expected_paths: ["tests", "catalog.yaml", "install.sh", "README.md", "docs", "workflows"]
      parallel_write_safe: false
    dod:
      - "Fake-executable tests cover positive and fail-closed cases."
      - "A dedicated CLI installer group depends on the shared workflow without changing shared or Desktop packaging."
      - "Documentation preserves the three-layer architecture."
    verification:
      - "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests"
      - "./scripts/validate-repo.sh"
    review: {required: true, mode: "code-review-deep"}
    stop_conditions: ["Existing runtime semantic-equivalence or safety tests regress."]
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P3-live-publication"
    title: "Authorize live smoke and publication separately"
    initial_status: "planned"
    priority: "medium"
    dependencies: ["P2-tests-distribution-docs"]
    risk: "high"
    kind: "delivery"
    objective: "Use the reviewed adapter only under exact live and publication authority."
    scope:
      in: ["optional live smoke", "commit", "push", "PR readiness"]
      out: ["automatic retry", "merge", "release", "promotion"]
    ownership:
      expected_paths: []
      parallel_write_safe: false
    dod:
      - "Offline review has no unresolved blockers."
      - "Each live or publication action has exact separate authorization."
    verification:
      - "git status --short --branch"
      - "git diff --check"
    review: {required: true, mode: "formal-gate"}
    stop_conditions: ["Live-smoke or publication authorization is absent."]
    human_gate:
      required: true
      gate: "live-smoke-and-publication"
      reason: "A real child session and GitHub publication are separate runtime/platform mutations."

project:
  schema_version: 2
  name: "Loop Engineering V3-B Isolated Candidate Evaluation"
  objective_id: "issue-141"
  source_of_truth:
    - "AGENTS.md"
    - "https://github.com/jeffery777/codex-dev-skills/issues/141"
    - "docs/loops/issue-141/loop-spec.md"
    - "docs/loops/issue-141/implementation-plan.md"
  contract_revision:
    previous_manifest_sha256: ""
    updated_at: "2026-08-12T03:30:00Z"

tasks:
  - id: "P0-contract"
    title: "Freeze the V3-B contract and implementation plan"
    initial_status: "ready"
    priority: "high"
    dependencies: []
    risk: "high"
    kind: "docs"
    objective: "Resolve exact family, execution, policy, environment, context, verifier, packet, privacy, CLI, and gate semantics."
    scope:
      in: ["Issue #141 packet", "planning review receipt"]
      out: ["production code", "arbitrary execution", "backend", "promotion"]
    ownership:
      expected_paths: ["docs/loops/issue-141"]
      parallel_write_safe: false
    dod:
      - "Every public-contract and authority semantic is exact and additive."
      - "Docs review and formal docs gate have no unresolved finding."
    verification:
      - "./scripts/project-python scripts/validate-loop-ledger.py"
      - "git diff --check"
    review: {required: true, mode: "docs-review"}
    stop_conditions:
      - "Any contract, execution, context, environment, privacy, verifier, threshold, or packet semantic remains ambiguous."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P1-evaluation-core"
    title: "Implement strict candidate evaluation and replay verification"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P0-contract"]
    risk: "high"
    kind: "implementation"
    objective: "Generate deterministic evaluation, verification, and non-promotional packet documents from validated V3-A/V2d sources."
    scope:
      in: ["candidate_evaluation.py", "core tests"]
      out: ["V2d/V3-A/V2b changes", "arbitrary code execution", "external write"]
    ownership:
      expected_paths: ["skills/loop-engineering/scripts", "tests"]
      parallel_write_safe: false
    dod:
      - "Every source is regenerated and every result is content-bound."
      - "Comparison, environment, replay, and packet dispositions are deterministic."
      - "False authority/action fields and pending promotion gate are exact."
    verification:
      - "PYTHONDONTWRITEBYTECODE=1 ./scripts/project-python -m unittest tests.test_candidate_evaluation tests.test_improvement_proposal tests.test_memory_contract"
    review: {required: true, mode: "code-review-deep"}
    stop_conditions:
      - "Implementation requires weakening or changing V2d, V3-A, or V2b."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P2-cli"
    title: "Implement bounded manual/CI evaluation CLI"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P1-evaluation-core"]
    risk: "high"
    kind: "implementation"
    objective: "Expose explicit-file evaluate, verify, packet, and validation routes with canonical stdout/stderr only."
    scope:
      in: ["evaluationctl.py", "CLI tests"]
      out: ["commands", "subprocess", "Git/platform/network", "files written"]
    ownership:
      expected_paths: ["skills/loop-engineering/scripts", "tests"]
      parallel_write_safe: false
    dod:
      - "Equivalent manual/CI inputs produce byte-identical output."
      - "Wrong/action routes, symlinks, unsafe paths, partial context, and bounds fail closed."
    verification:
      - "PYTHONDONTWRITEBYTECODE=1 ./scripts/project-python -m unittest tests.test_evaluationctl"
    review: {required: true, mode: "code-review-deep"}
    stop_conditions:
      - "A CLI behavior requires external mutation or runtime service."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P3-fixtures-eval"
    title: "Add synthetic fixtures, tests, evals, and regressions"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P2-cli"]
    risk: "high"
    kind: "implementation"
    objective: "Prove all required V3-B scenarios and exact 100 percent / zero-false thresholds."
    scope:
      in: ["evals/candidate-evaluation", "tests", "eval script", "repository validation"]
      out: ["real/private records", "backend fixtures", "network"]
    ownership:
      expected_paths: ["evals/candidate-evaluation", "tests", "scripts"]
      parallel_write_safe: false
    dod:
      - "All required scenarios and invalid context classes pass."
      - "V1 through V3-A and V2b regressions remain green."
    verification:
      - "./scripts/project-python scripts/eval-candidate-evaluation.py"
      - "PYTHONDONTWRITEBYTECODE=1 ./scripts/project-python -m unittest discover -s tests -p 'test_*.py'"
    review: {required: true, mode: "code-review-deep"}
    stop_conditions:
      - "A required case cannot be represented with public synthetic data."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P4-docs-package"
    title: "Align public docs and portable packaging"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P3-fixtures-eval"]
    risk: "medium"
    kind: "docs"
    objective: "Document and package V3-B without changing release/version metadata or implementing later stages."
    scope:
      in: ["contract/reference", "README/roadmap/program", "package inventory"]
      out: ["version bump", "release target", "M1", "V3-C"]
    ownership:
      expected_paths: ["README.md", "docs", "skills/loop-engineering", "install.sh", "catalog.yaml"]
      parallel_write_safe: false
    dod:
      - "Public usage, authority, memory-off, and packet boundaries agree."
      - "Target release remains TBD and excluded stages remain absent."
    verification:
      - "./scripts/validate-repo.sh"
      - "./install.sh manifest"
      - "git diff --check"
    review: {required: true, mode: "docs-review"}
    stop_conditions:
      - "Packaging requires version/release changes or backend integration."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P5-readiness"
    title: "Close reviews and reach exact-head draft-PR readiness"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P4-docs-package"]
    risk: "high"
    kind: "review"
    objective: "Close verification and reviews, publish the authorized draft PR, and prove exact-head hosted CI."
    scope:
      in: ["verification", "reviews", "commit/push", "draft PR", "hosted CI"]
      out: ["ready transition", "merge", "release", "deploy", "activation", "promotion"]
    ownership:
      expected_paths: ["docs/loops/issue-141"]
      parallel_write_safe: false
    dod:
      - "No unresolved finding remains."
      - "Local, remote, PR, and hosted-CI heads match and PR stays draft."
    verification:
      - "PYTHONDONTWRITEBYTECODE=1 ./scripts/project-python -m unittest discover -s tests -p 'test_*.py'"
      - "./scripts/validate-repo.sh"
      - "git diff --check"
      - "git status --short --branch"
    review: {required: true, mode: "formal-gate"}
    stop_conditions:
      - "Any exact-head verification, review, CI, or binding remains incomplete."
      - "Any next action would merge, release, deploy, activate, or promote."
    human_gate:
      required: true
      gate: "post-draft-publication"
      reason: "Ready transition, merge, tag, Release, deployment, activation, and promotion require a new human decision."

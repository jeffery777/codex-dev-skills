project:
  schema_version: 2
  name: "v0.13.0 V3-B release closure"
  objective_id: "issue-143"
  source_of_truth:
    - "AGENTS.md"
    - "docs/loops/issue-143/release-spec.md"
    - "docs/loops/issue-143/implementation-plan.md"
    - "docs/release-notes-v0.13.0.md"
    - "docs/release-readiness.md"
  contract_revision:
    previous_manifest_sha256: ""
    updated_at: "2026-08-12T08:55:05Z"

tasks:
  - id: "R0-baseline"
    title: "Verify release baseline and ownership"
    initial_status: "ready"
    priority: "high"
    dependencies: []
    risk: "medium"
    kind: "review"
    objective: "Prove accepted main, release, tag, and collision state before mutation."
    scope:
      in: ["Git state", "GitHub Issue/PR state", "tag state", "Release state"]
      out: ["tag creation", "Release publication"]
    ownership:
      expected_paths: []
      parallel_write_safe: false
    dod:
      - "Accepted main and Issue #143 ownership are current."
      - "Latest Release and v0.13.0 tag/Release absence are recorded."
    verification: ["git status --short --branch", "git ls-remote --tags origin refs/tags/v0.13.0"]
    review: {required: true, mode: "release-plan"}
    stop_conditions: ["A release collision or existing v0.13.0 tag/Release appears."]
    human_gate: {required: false, gate: "", reason: ""}

  - id: "R1-release-alignment"
    title: "Align v0.13.0 release records"
    initial_status: "planned"
    priority: "high"
    dependencies: ["R0-baseline"]
    risk: "medium"
    kind: "docs"
    objective: "Make the repository release record internally consistent."
    scope:
      in: ["version metadata", "release notes", "README", "roadmap/program status", "release tests"]
      out: ["runtime behavior", "Memory M1/M2", "V3-C", "deployment", "activation"]
    ownership:
      expected_paths: ["install.sh", "catalog.yaml", "README.md", "docs", "tests"]
      parallel_write_safe: false
    dod:
      - "Release surfaces consistently identify v0.13.0."
      - "V3-B and later-stage authority boundaries remain exact."
    verification: ["./scripts/project-python -m unittest tests.test_candidate_evaluation_contract_docs tests.test_improvement_lineage_contract_docs tests.test_improvement_proposal_contract_docs", "git diff --check"]
    review: {required: true, mode: "docs-review-gate"}
    stop_conditions: ["Runtime or public-contract behavior would change."]
    human_gate: {required: false, gate: "", reason: ""}

  - id: "R2-verification-review"
    title: "Verify and review the release candidate"
    initial_status: "planned"
    priority: "high"
    dependencies: ["R1-release-alignment"]
    risk: "high"
    kind: "review"
    objective: "Produce exact rerunnable release-readiness evidence."
    scope:
      in: ["tests", "evals", "repository validation", "privacy", "formal reviews"]
      out: ["merge", "tag", "Release"]
    ownership:
      expected_paths: ["docs/loops/issue-143/receipts"]
      parallel_write_safe: false
    dod:
      - "All required checks and gates pass without unresolved findings."
      - "Receipts contain no private or machine-local material."
    verification: ["./scripts/project-python -m unittest discover -s tests -p 'test_*.py'", "./scripts/validate-repo.sh", "git diff --check"]
    review: {required: true, mode: "merge-review-deep"}
    stop_conditions: ["Verification or review fails without an in-scope fix."]
    human_gate: {required: false, gate: "", reason: ""}

  - id: "R3-pr-merge"
    title: "Prepare, review, and merge the exact release PR"
    initial_status: "planned"
    priority: "high"
    dependencies: ["R2-verification-review"]
    risk: "high"
    kind: "publication"
    objective: "Merge only the exact reviewed v0.13.0 release-preparation head."
    scope:
      in: ["commit", "push", "draft PR", "hosted CI", "review", "ready transition", "merge"]
      out: ["tag", "Release", "deploy", "activation"]
    ownership:
      expected_paths: ["docs/loops/issue-143/receipts"]
      parallel_write_safe: false
    dod:
      - "Exact-head hosted CI and review pass with no unresolved thread."
      - "PR merges using expected-head-SHA protection."
    verification: ["GitHub PR metadata", "GitHub Actions exact-head result", "GitHub merge result"]
    review: {required: true, mode: "merge-readiness-gate"}
    stop_conditions: ["PR head/base moves or a required check fails."]
    human_gate: {required: true, gate: "merge", reason: "Explicitly authorized by the Issue #143 release request after exact gates pass."}

  - id: "R4-publish"
    title: "Tag and publish v0.13.0"
    initial_status: "planned"
    priority: "high"
    dependencies: ["R3-pr-merge"]
    risk: "high"
    kind: "release"
    objective: "Bind the exact reviewed release merge to v0.13.0 tag and GitHub Release."
    scope:
      in: ["annotated tag", "tag push", "GitHub Release", "public verification"]
      out: ["deploy", "activation", "promotion", "global installation", "later phases"]
    ownership:
      expected_paths: []
      parallel_write_safe: false
    dod:
      - "Tag and Release bind the exact approved release merge commit."
      - "Latest public Release is non-draft/non-prerelease v0.13.0."
    verification: ["Git/GitHub exact SHA and Release metadata"]
    review: {required: true, mode: "release-publication-gate"}
    stop_conditions: ["Exact evidence drifts or existing tag/Release appears."]
    human_gate: {required: true, gate: "tag-release", reason: "Explicitly authorized by the Issue #143 release request after exact gates pass."}

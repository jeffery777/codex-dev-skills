project:
  schema_version: 2
  name: "Loop Engineering V2d-A Operational Evidence V0"
  objective_id: "issue-121"
  source_of_truth:
    - "AGENTS.md"
    - "https://github.com/jeffery777/codex-dev-skills/issues/121"
    - "docs/loops/issue-121/loop-spec.md"
    - "docs/loops/issue-121/implementation-plan.md"
  contract_revision:
    previous_manifest_sha256: ""
    updated_at: "2026-07-29T01:48:03Z"

tasks:
  - id: "P0-contract"
    title: "Freeze V2d-A public contract and implementation plan"
    initial_status: "ready"
    priority: "high"
    dependencies: []
    risk: "high"
    kind: "docs"
    objective: "Define envelope, kinds, taxonomy, redaction, references, authority, data placement, release scope, and verification."
    scope:
      in: ["Issue #121 spec", "implementation plan", "task manifest", "initial ledger"]
      out: ["production code", "external write"]
    ownership:
      expected_paths: ["docs/loops/issue-121"]
      parallel_write_safe: false
    dod:
      - "Public-contract, privacy/redaction, authority, and release semantics are explicit."
      - "Docs review and formal docs gate have no unresolved MUST-FIX findings."
    verification:
      - "python3 scripts/validate-loop-ledger.py"
      - "git diff --check"
    review: {required: true, mode: "docs-review"}
    stop_conditions:
      - "Public-contract, privacy/redaction, authority, or data-placement semantics remain ambiguous."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P1-validator"
    title: "Implement strict operational-evidence validators and CLI"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P0-contract"]
    risk: "high"
    kind: "implementation"
    objective: "Implement strict offline parsing, kind validation, privacy checks, canonical digests, set relationships, and CLI dispositions."
    scope:
      in: ["operational_evidence.py", "evidencectl.py"]
      out: ["backend", "network", "runtime mutation", "V2d-B"]
    ownership:
      expected_paths: ["skills/loop-engineering/scripts"]
      parallel_write_safe: false
    dod:
      - "All five document kinds and set relationships validate fail closed."
      - "The four authority invariants cannot be raised."
      - "No rejected private or secret value is echoed."
    verification:
      - "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.test_operational_evidence tests.test_evidencectl"
    review: {required: true, mode: "code-review-deep"}
    stop_conditions:
      - "Implementation requires a broader public contract or shared-validator refactor."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P2-fixtures-eval"
    title: "Add fixtures, tests, evals, and repository validation"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P1-validator"]
    risk: "high"
    kind: "implementation"
    objective: "Prove positive behavior, deterministic validation, privacy rejection, tamper resistance, and no false authority."
    scope:
      in: ["fixtures", "unit tests", "CLI tests", "eval suite", "repository validation"]
      out: ["real operational records", "private PoC"]
    ownership:
      expected_paths: ["evals/operational-evidence", "tests", "scripts"]
      parallel_write_safe: false
    dod:
      - "Required positive and negative fixture inventory is complete."
      - "Eval thresholds are exact and all focused tests pass."
    verification:
      - "python3 scripts/eval-operational-evidence.py"
      - "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest tests.test_operational_evidence tests.test_evidencectl tests.test_eval_operational_evidence"
    review: {required: true, mode: "code-review-deep"}
    stop_conditions:
      - "A required privacy or tamper case cannot be represented safely with synthetic data."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P3-docs-release"
    title: "Align public docs, packaging, and v0.10.0 release preparation"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P2-fixtures-eval"]
    risk: "medium"
    kind: "docs"
    objective: "Publish the V2d-A contract surface and prepare v0.10.0 in the same branch."
    scope:
      in: ["contract docs", "README", "roadmap", "program docs", "installer/catalog", "release notes"]
      out: ["separate release branch", "tag", "GitHub Release"]
    ownership:
      expected_paths: ["README.md", "docs", "skills/loop-engineering", "install.sh", "catalog.yaml"]
      parallel_write_safe: false
    dod:
      - "Public usage, boundaries, relationships, and release metadata are aligned."
      - "README, installer, catalog, and release notes identify v0.10.0."
    verification:
      - "./scripts/validate-repo.sh"
      - "git diff --check"
    review: {required: true, mode: "docs-review"}
    stop_conditions:
      - "Release scope would require a separate branch or unrelated feature."
    human_gate: {required: false, gate: "", reason: ""}

  - id: "P4-readiness"
    title: "Close reviews and prepare exact-head PR and release readiness"
    initial_status: "planned"
    priority: "high"
    dependencies: ["P3-docs-release"]
    risk: "high"
    kind: "review"
    objective: "Run full verification, deep code/docs/security review, formal gates, and record residual risk."
    scope:
      in: ["verification", "review closure", "readiness receipts"]
      out: ["commit", "push", "PR creation", "merge", "tag", "release publication"]
    ownership:
      expected_paths: ["docs/loops/issue-121"]
      parallel_write_safe: false
    dod:
      - "No unresolved MUST-FIX finding remains."
      - "Exact-head verification and readiness evidence are recorded."
    verification:
      - "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'"
      - "./scripts/validate-repo.sh"
      - "git diff --check"
    review: {required: true, mode: "formal-gate"}
    stop_conditions:
      - "Publication or release action requires exact authorization."
    human_gate:
      required: true
      gate: "publication"
      reason: "Commit, push, PR creation, merge, tag, and GitHub Release require exact authorization."

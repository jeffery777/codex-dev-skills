name: Repository Validation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Verify exact head and Python environment
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python -c 'import sys, yaml; print(sys.executable); print(yaml.__version__)'

      - name: Run full unit suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run repository validation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: ./scripts/validate-repo.sh

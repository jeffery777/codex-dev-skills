name: Repository Validation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up repository Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version

      - name: Install repository validation tools
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi

          apt_options=(
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=10s 90s apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=10s 90s apt-get "${apt_options[@]}" install --no-install-recommends --yes ripgrep
          rg --version

      - name: Install verification dependencies
        run: ./scripts/project-python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Verify exact head and Python environment
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          ./scripts/project-python -c 'import sys, yaml; print(sys.executable); print(yaml.__version__)'
          git switch --create ci-validation "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Run repository checks without duplicate unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: ./scripts/validate-repo.sh --skip-unit-tests

      - name: Run full unit suite once
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: ./scripts/project-python -m unittest discover -s tests -p 'test_*.py'

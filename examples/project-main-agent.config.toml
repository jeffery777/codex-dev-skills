# Optional everyday preset; use only when the destination supports GPT-6.1 Sol.
# Merge these three keys into a trusted project's .codex/config.toml for project
# scope, or into your user config only when you want a cross-project default.
# This example is not automatically installed or loaded by Codex.
# Explicit CLI or Desktop conversation settings must be checked separately.
